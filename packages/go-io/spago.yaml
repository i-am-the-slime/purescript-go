package:
  name: go-io
  description: Haskell-style IO on goroutines, and Go's error, for PureScript compiled to Go with Iris
  dependencies:
    - aff
    - arrays
    - console
    - control
    - datetime
    - effect
    - either
    - exceptions
    - foldable-traversable
    - maybe
    - newtype
    - parallel
    - prelude
    - tailrec
    - transformers
    - tuples
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: i-am-the-slime
      githubRepo: purescript-go
      subdir: packages/go-io
